####
##   Liquibase MongoDB Configuration
##   Adjust connection URL and changelog path for your environment.
####

# MongoDB connection URL
# Format: mongodb://[username:password@]host[:port]/database[?options]
url=mongodb://localhost:27017/myapp_db

# Changelog file (relative to working directory)
changelog-file=changelogs/db.changelog-master.xml

# Do not specify a driver — the MongoDB extension handles this automatically.
# driver=

# Optional: authentication
# url=mongodb://myuser:mypass@host:27017/myapp_db?authSource=admin

# Liquibase settings
liquibase.hub.mode=off
