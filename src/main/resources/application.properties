spring.application.name=springboot-graphql-app

# GraphQL endpoint path (POST requests from Postman go here)
# Spring Boot 4.x / Spring for GraphQL 2.x: use spring.graphql.http.path
# (spring.graphql.path was removed; it is now ignored and the endpoint falls back to /graphql)
spring.graphql.http.path=/graphql

# Enable GraphiQL browser UI for testing
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# Enable schema introspection
spring.graphql.schema.introspection.enabled=true

# Server port
server.port=8080
